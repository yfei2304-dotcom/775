name: Publish DoLP v0.778 Aoki Utage + Mysterious

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-site-v0778.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolp-v0778-pages
  cancel-in-progress: true

env:
  DOLP_VERSION: '0.778'
  PACKAGE_URL: 'https://dolp.download/DoLP_aoki_utage_mys/v0.778/DoLP_aoki_utage_mys_v0.778.zip'
  BUILD_DIR: '/tmp/dolp-v0778-build'
  SITE_DIR: '/tmp/dolp-v0778-site'
  PAGES_DIR: '/tmp/dolp-v0778-pages'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the v0.778 Aoki Utage + Mysterious package
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_DIR" = "/tmp/dolp-v0778-build"
          test "$SITE_DIR" = "/tmp/dolp-v0778-site"
          rm -rf "$BUILD_DIR" "$SITE_DIR"
          mkdir -p "$BUILD_DIR/unpacked" "$SITE_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            --user-agent 'Mozilla/5.0 DoLP v0.778 GitHub Pages builder' \
            "$PACKAGE_URL" \
            --output "$BUILD_DIR/package.zip"

          unzip -t "$BUILD_DIR/package.zip" >/dev/null
          unzip -q "$BUILD_DIR/package.zip" -d "$BUILD_DIR/unpacked"

          SOURCE_HTML="$(find "$BUILD_DIR/unpacked" -type f -iname 'Degrees of Lewdity*.html' -print -quit)"
          test -n "$SOURCE_HTML"
          SOURCE_ROOT="$(dirname "$SOURCE_HTML")"
          test -d "$SOURCE_ROOT/img"

          cp -a "$SOURCE_ROOT"/. "$SITE_DIR"/
          cp "$SOURCE_HTML" "$BUILD_DIR/upstream.html"
          basename "$SOURCE_HTML" > "$BUILD_DIR/source-html-name.txt"

          find "$SITE_DIR" -maxdepth 1 -type f -iname 'Degrees of Lewdity*.html' -delete
          cp "$BUILD_DIR/upstream.html" "$SITE_DIR/index.html"

          grep -aFq 'DoLP v0.778' "$BUILD_DIR/upstream.html"
          test "$(stat -c '%s' "$BUILD_DIR/upstream.html")" -gt 20000000
          test "$(stat -c '%s' "$BUILD_DIR/upstream.html")" -lt 99000000

          IMAGE_FILES="$(find "$SITE_DIR/img" -type f | wc -l)"
          IMAGE_BYTES="$(find "$SITE_DIR/img" -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')"
          test "$IMAGE_FILES" -gt 30000
          test "$IMAGE_BYTES" -gt 100000000
          echo "Source HTML: $(cat "$BUILD_DIR/source-html-name.txt")"
          echo "HTML bytes: $(stat -c '%s' "$BUILD_DIR/upstream.html")"
          echo "Image files: $IMAGE_FILES"
          echo "Image bytes: $IMAGE_BYTES"

      - name: Add iPhone launch metadata and remove the obsolete v0.775 loader
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import shutil
          import struct
          import zlib

          build = Path(os.environ["BUILD_DIR"])
          site = Path(os.environ["SITE_DIR"])
          index = site / "index.html"
          upstream = build / "upstream.html"

          for stale_file in ("sw.js", "pako_inflate.min.js"):
              (site / stale_file).unlink(missing_ok=True)
          shutil.rmtree(site / "payload", ignore_errors=True)

          html = index.read_text(encoding="utf-8-sig")
          head = re.search(r"<head\b[^>]*>", html, flags=re.IGNORECASE)
          if not head:
              raise SystemExit("The upstream game has no <head> element")

          mobile = """
          <!-- data-dolp-pwa-v0778 -->
          <meta name="theme-color" content="#111111">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="DoLP v0.778">
          <link rel="manifest" href="manifest.json">
          <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
          <script>
          (() => {
            const here = new URL(".", location.href).pathname;
            if ("serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations()
                .then(registrations => Promise.all(
                  registrations
                    .filter(registration => new URL(registration.scope).pathname === here)
                    .map(registration => registration.unregister())
                ))
                .catch(() => {});
            }
            if ("caches" in window) {
              caches.keys()
                .then(keys => Promise.all(
                  keys.filter(key => key.includes("v0775")).map(key => caches.delete(key))
                ))
                .catch(() => {});
            }
          })();
          </script>
          """
          html = html[:head.end()] + mobile + html[head.end():]
          index.write_text(html, encoding="utf-8")

          optional_files = {
              "modList.json": "[]\n",
              "style.css": "/* Optional DoLP stylesheet hook. */\n",
              "usettings.js": "// Optional SugarCube user-settings hook.\n",
          }
          for filename, content in optional_files.items():
              target = site / filename
              if not target.exists():
                  target.write_text(content, encoding="utf-8")

          manifest = {
              "name": "DoLP v0.778 · Aoki Utage + Mysterious",
              "short_name": "DoLP v0.778",
              "start_url": "./",
              "scope": "./",
              "display": "standalone",
              "background_color": "#111111",
              "theme_color": "#111111",
              "icons": [
                  {
                      "src": "icon-192.png",
                      "sizes": "192x192",
                      "type": "image/png",
                      "purpose": "any maskable",
                  }
              ],
          }
          (site / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          def png_chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF)
              )

          def write_icon(path, size):
              rows = []
              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      margin = size // 5
                      inside = margin < x < size - margin and margin < y < size - margin
                      stripe = size * 2 // 5 <= x <= size * 3 // 5
                      accent = inside and stripe and size * 2 // 5 <= y <= size * 3 // 5
                      rgb = (180, 25, 45) if accent else ((242, 242, 242) if inside else (17, 17, 17))
                      row += bytes((*rgb, 255))
                  rows.append(bytes(row))
              data = (
                  b"\x89PNG\r\n\x1a\n"
                  + png_chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
                  + png_chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
                  + png_chunk(b"IEND", b"")
              )
              path.write_bytes(data)

          write_icon(site / "icon-192.png", 192)
          write_icon(site / "apple-touch-icon.png", 180)
          (site / ".nojekyll").touch()
          (site / "version.txt").write_text("DoLP v0.778 · Aoki Utage + Mysterious\n", encoding="utf-8")

          image_paths = [path for path in (site / "img").rglob("*") if path.is_file()]
          upstream_bytes = upstream.read_bytes()
          published_bytes = index.read_bytes()
          marker = re.search(rb"([0-9]+(?:\.[0-9]+){2,3}\s+DoLP v0\.778)", upstream_bytes)
          info = {
              "version": "DoLP v0.778",
              "edition": "Aoki Utage + Mysterious",
              "source": os.environ["PACKAGE_URL"],
              "sourceHtml": (build / "source-html-name.txt").read_text(encoding="utf-8").strip(),
              "core": marker.group(1).decode("ascii") if marker else "DoLP v0.778",
              "packageBytes": (build / "package.zip").stat().st_size,
              "packageSha256": hashlib.sha256((build / "package.zip").read_bytes()).hexdigest(),
              "upstreamHtmlBytes": len(upstream_bytes),
              "upstreamHtmlSha256": hashlib.sha256(upstream_bytes).hexdigest(),
              "publishedHtmlBytes": len(published_bytes),
              "publishedHtmlSha256": hashlib.sha256(published_bytes).hexdigest(),
              "imageFiles": len(image_paths),
              "imageBytes": sum(path.stat().st_size for path in image_paths),
              "deployment": "direct index.html; no Service Worker or compressed loader",
              "sourceCommit": os.environ["GITHUB_SHA"],
              "publishedAt": datetime.now(timezone.utc).isoformat(),
          }
          (site / "build-info.json").write_text(
              json.dumps(info, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Validate the generated website
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SITE_DIR/index.html"
          test -d "$SITE_DIR/img"
          test -s "$SITE_DIR/build-info.json"
          test -s "$SITE_DIR/manifest.json"
          test -s "$SITE_DIR/apple-touch-icon.png"
          test ! -e "$SITE_DIR/sw.js"
          test ! -e "$SITE_DIR/payload"
          grep -aFq 'DoLP v0.778' "$SITE_DIR/index.html"
          grep -aFq 'data-dolp-pwa-v0778' "$SITE_DIR/index.html"
          python3 -m json.tool "$SITE_DIR/build-info.json" >/dev/null
          python3 -m json.tool "$SITE_DIR/manifest.json" >/dev/null

          HTML_BYTES="$(stat -c '%s' "$SITE_DIR/index.html")"
          IMAGE_FILES="$(find "$SITE_DIR/img" -type f | wc -l)"
          test "$HTML_BYTES" -lt 99000000
          test "$IMAGE_FILES" -gt 30000

      - name: Replace the gh-pages branch contents
        shell: bash
        run: |
          set -euo pipefail
          test "$PAGES_DIR" = "/tmp/dolp-v0778-pages"
          rm -rf "$PAGES_DIR"

          git fetch origin gh-pages
          git worktree add --detach "$PAGES_DIR" origin/gh-pages
          test -f "$PAGES_DIR/.git"

          git -C "$PAGES_DIR" rm -r --ignore-unmatch .
          find "$PAGES_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          cp -a "$SITE_DIR"/. "$PAGES_DIR"/

          git -C "$PAGES_DIR" add -A
          git -C "$PAGES_DIR" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish DoLP v0.778 Aoki Utage + Mysterious'
          git -C "$PAGES_DIR" push origin HEAD:gh-pages
