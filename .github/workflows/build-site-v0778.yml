name: Publish DoLP v0.778 Aoki Utage + Mysterious

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-site-v0778.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dolp-v0778-pages
  cancel-in-progress: true

env:
  DOLP_VERSION: '0.778'
  PACKAGE_URL: 'https://dolp.download/DoLP_aoki_utage_mys/v0.778/DoLP_aoki_utage_mys_v0.778.zip'
  PACKAGE_BYTES: '125324567'
  PACKAGE_SHA256: '67e21e9615d94783df26c3e1dfebf51840cb68278e419606ea69052564a0da51'
  UPSTREAM_HTML_BYTES: '57188965'
  UPSTREAM_HTML_SHA256: '6144728ebb7d47ddc2ee861281ddfadd161d1bf67babf6cc59510de1a28ca6ef'
  EXPECTED_IMAGE_FILES: '31349'
  EXPECTED_IMAGE_BYTES: '143622449'
  LOADER_URL: 'https://github.com/Lyoko-Jeremie/DoLModLoaderBuild/releases/download/v2.101.1-dol-0.5.12.11-240b837588c6f6ee6b07df0b161aa28f844834b0/DoL-ModLoader-2.101.1-dol-0.5.12.11-240b837588c6f6ee6b07df0b161aa28f844834b0.zip'
  LOADER_SHA256: '5f02311487aa0acbaa834f1c8a284328861c9e464a4d39a8ea56efe2cefddfdc'
  I18N_SOURCE_URL: 'https://github.com/NumberSir/DoL-I18n-Build/releases/download/0.5.12.11-chs-auto-nightly-auto--d230276d3f0390986e385a5b924c286769bcab1a/ModI18N-0.5.12.11-chs-auto-nightly.mod.zip'
  I18N_SOURCE_SHA256: 'e43a5c79847b20854cd1181ed8b010ee96ea2609167e5f927c442ba8cbdd7124'
  I18N_SOURCE_VERSION: '0.5.12.11-chs-auto-nightly'
  I18N_TW_FILENAME: 'ModI18N-0.5.12.11-zhtw.mod.zip'
  BUILD_DIR: '/tmp/dolp-v0778-build'
  SITE_DIR: '/tmp/dolp-v0778-site'
  PAGES_DIR: '/tmp/dolp-v0778-pages'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the v0.778 Aoki Utage + Mysterious package
        shell: bash
        run: |
          set -euo pipefail
          test "$BUILD_DIR" = "/tmp/dolp-v0778-build"
          test "$SITE_DIR" = "/tmp/dolp-v0778-site"
          rm -rf "$BUILD_DIR" "$SITE_DIR"
          mkdir -p "$BUILD_DIR/unpacked" "$SITE_DIR"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            --user-agent 'Mozilla/5.0 DoLP v0.778 GitHub Pages builder' \
            "$PACKAGE_URL" \
            --output "$BUILD_DIR/package.zip"

          test "$(stat -c '%s' "$BUILD_DIR/package.zip")" = "$PACKAGE_BYTES"
          printf '%s  %s\n' "$PACKAGE_SHA256" "$BUILD_DIR/package.zip" | sha256sum --check -
          unzip -t "$BUILD_DIR/package.zip" >/dev/null
          unzip -q "$BUILD_DIR/package.zip" -d "$BUILD_DIR/unpacked"

          SOURCE_HTML="$(find "$BUILD_DIR/unpacked" -type f -iname 'Degrees of Lewdity*.html' -print -quit)"
          test -n "$SOURCE_HTML"
          SOURCE_ROOT="$(dirname "$SOURCE_HTML")"
          test -d "$SOURCE_ROOT/img"

          cp -a "$SOURCE_ROOT"/. "$SITE_DIR"/
          cp "$SOURCE_HTML" "$BUILD_DIR/upstream.html"
          basename "$SOURCE_HTML" > "$BUILD_DIR/source-html-name.txt"

          find "$SITE_DIR" -maxdepth 1 -type f -iname 'Degrees of Lewdity*.html' -delete
          cp "$BUILD_DIR/upstream.html" "$SITE_DIR/index.html"

          grep -aFq '0.5.12.11 DoLP v0.778' "$BUILD_DIR/upstream.html"
          test "$(stat -c '%s' "$BUILD_DIR/upstream.html")" = "$UPSTREAM_HTML_BYTES"
          printf '%s  %s\n' "$UPSTREAM_HTML_SHA256" "$BUILD_DIR/upstream.html" | sha256sum --check -

          IMAGE_FILES="$(find "$SITE_DIR/img" -type f | wc -l)"
          IMAGE_BYTES="$(find "$SITE_DIR/img" -type f -printf '%s\n' | awk '{sum += $1} END {print sum + 0}')"
          test "$IMAGE_FILES" = "$EXPECTED_IMAGE_FILES"
          test "$IMAGE_BYTES" = "$EXPECTED_IMAGE_BYTES"
          echo "Source HTML: $(cat "$BUILD_DIR/source-html-name.txt")"
          echo "HTML bytes: $(stat -c '%s' "$BUILD_DIR/upstream.html")"
          echo "Image files: $IMAGE_FILES"
          echo "Image bytes: $IMAGE_BYTES"

      - name: Install the official ModLoader v2.101.1 runtime for core 0.5.12.11
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            --user-agent 'Mozilla/5.0 DoLP ModLoader installer' \
            "$LOADER_URL" \
            --output "$BUILD_DIR/modloader.zip"

          printf '%s  %s\n' "$LOADER_SHA256" "$BUILD_DIR/modloader.zip" | sha256sum --check -
          unzip -t "$BUILD_DIR/modloader.zip" >/dev/null
          mkdir -p "$BUILD_DIR/modloader-unpacked"
          unzip -q "$BUILD_DIR/modloader.zip" -d "$BUILD_DIR/modloader-unpacked"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import shutil

          build = Path(os.environ["BUILD_DIR"])
          root = build / "modloader-unpacked"
          required = (
              b"0.5.12.11",
              b"window.modDataValueZipList",
              b"modSC2DataManager",
              b"jsPreloader",
          )
          candidates = []
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() != ".html":
                  continue
              raw = path.read_bytes()
              lowered_name = path.name.lower()
              score = sum(200 for marker in required if marker in raw)
              if lowered_name.endswith(".mod.html"):
                  score += 100
              if "polyfill" not in lowered_name:
                  score += 20
              candidates.append((score, len(raw), path, raw))

          if not candidates:
              raise SystemExit("The official ModLoader archive contains no HTML build")

          for score, size, path, raw in sorted(candidates, reverse=True):
              markers = [marker.decode("ascii") for marker in required if marker in raw]
              print(f"ModLoader candidate: {path.relative_to(root)} | {size} bytes | score {score} | {markers}")

          compatible = [
              item for item in candidates
              if all(marker in item[3] for marker in required)
          ]
          if not compatible:
              raise SystemExit("No ModLoader HTML matches core 0.5.12.11 and the required runtime markers")

          _, _, selected, _ = max(compatible, key=lambda item: (item[0], item[1]))
          shutil.copyfile(selected, build / "loader-companion.html")
          (build / "loader-html-name.txt").write_text(
              str(selected.relative_to(root)) + "\n",
              encoding="utf-8",
          )
          print(f"Selected official ModLoader build: {selected.relative_to(root)}")
          PY

          grep -aFq '0.5.12.11' "$BUILD_DIR/loader-companion.html"
          grep -aFq 'window.modDataValueZipList' "$BUILD_DIR/loader-companion.html"
          grep -aFq 'modSC2DataManager' "$BUILD_DIR/loader-companion.html"
          grep -aFq 'jsPreloader' "$BUILD_DIR/loader-companion.html"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re

          build = Path(os.environ["BUILD_DIR"])
          site = Path(os.environ["SITE_DIR"])
          official = (build / "upstream.html").read_text(encoding="utf-8-sig")
          companion = (build / "loader-companion.html").read_text(encoding="utf-8-sig")

          script_pattern = re.compile(r"<script\b[^>]*>[\s\S]*?</script>", re.IGNORECASE)
          companion_scripts = [match.group(0) for match in script_pattern.finditer(companion)]
          if len(companion_scripts) < 2:
              raise SystemExit(f"Expected the two leading ModLoader blocks, found {len(companion_scripts)} scripts")

          # The official ModLoader output starts with exactly two injected blocks.
          # Later scripts include the already-patched SugarCube engine and must not
          # be copied, or SugarCube initializes twice and corrupts State.prng.
          loader_blocks = companion_scripts[:2]
          if "window.modDataValueZipList" not in loader_blocks[0]:
              raise SystemExit("Official ModLoader block 1 is not modDataValueZipList")
          if "modSC2DataManager" not in loader_blocks[1] or "jsPreloader" not in loader_blocks[1]:
              raise SystemExit("Official ModLoader block 2 is not the BeforeSC2 runtime")

          if "window.modDataValueZipList" in official or "modSC2DataManager" in official:
              raise SystemExit("The v0.778 upstream HTML unexpectedly already contains ModLoader")

          sugarcube_candidates = []
          for match in script_pattern.finditer(official):
              block = match.group(0)
              if (
                  re.search(r'id=["\']script-sugarcube["\']', block, re.IGNORECASE)
                  and "window.SugarCube" in block
              ):
                  sugarcube_candidates.append(match)

          if not sugarcube_candidates:
              raise SystemExit("Could not locate the v0.778 SugarCube runtime")
          target = sugarcube_candidates[-1]
          sugarcube = target.group(0)

          start_marker = "window.SugarCube={},jQuery((()=>{"
          end_marker = "}))})(window,window.document,jQuery);"
          if sugarcube.count(start_marker) != 1:
              raise SystemExit(f"Unexpected SugarCube start marker count: {sugarcube.count(start_marker)}")
          end_at = sugarcube.rfind(end_marker)
          if end_at < 0:
              raise SystemExit("SugarCube end marker not found")

          sugarcube = sugarcube.replace(
              start_marker,
              "window.SugarCube={},window.mainStart=((()=>{",
              1,
          )
          end_at = sugarcube.rfind(end_marker)
          replacement = """}))
          if (typeof window.modSC2DataManager !== 'undefined') { window.modSC2DataManager.startInit().then(() => window.jsPreloader.startLoad()).then(() => {window.mainStart();if(typeof window.initI10n==='function')window.initI10n(l10nStrings);}).catch(err=>console.error(err)); } else { window.mainStart();if(typeof window.initI10n==='function')window.initI10n(l10nStrings); }
          })(window,window.document,jQuery);"""
          sugarcube = sugarcube[:end_at] + replacement + sugarcube[end_at + len(end_marker):]

          merged = (
              official[:target.start()]
              + "\n".join(loader_blocks)
              + "\n"
              + sugarcube
              + official[target.end():]
          )
          csp = "content=\"default-src 'self' 'unsafe-eval' 'unsafe-inline'\""
          if csp in merged:
              merged = merged.replace(
                  csp,
                  "content=\"default-src 'self' 'unsafe-eval' 'unsafe-inline' *\"",
                  1,
              )

          required = (
              "DoLP v0.778",
              "window.modDataValueZipList",
              "modSC2DataManager",
              "window.mainStart",
          )
          for marker in required:
              if marker not in merged:
                  raise SystemExit(f"Merged HTML is missing {marker}")

          (site / "index.html").write_text(merged, encoding="utf-8")
          report = {
              "modLoader": "ML v2.101.1",
              "loaderCore": "0.5.12.11",
              "loaderSourceHtml": (build / "loader-html-name.txt").read_text(encoding="utf-8").strip(),
              "loaderBlocks": len(loader_blocks),
              "loaderCompanionBytes": (build / "loader-companion.html").stat().st_size,
              "loaderCompanionSha256": hashlib.sha256(
                  (build / "loader-companion.html").read_bytes()
              ).hexdigest(),
              "mergedHtmlBytes": len(merged.encode("utf-8")),
              "mergedHtmlSha256": hashlib.sha256(merged.encode("utf-8")).hexdigest(),
          }
          (build / "loader-info.json").write_text(
              json.dumps(report, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2))
          PY

      - name: Build the pinned Traditional Chinese ModI18N for core 0.5.12.11
        shell: bash
        run: |
          set -euo pipefail

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            --max-time 900 \
            --user-agent 'Mozilla/5.0 DoLP zh-TW ModI18N builder' \
            "$I18N_SOURCE_URL" \
            --output "$BUILD_DIR/ModI18N-source.mod.zip"

          printf '%s  %s\n' "$I18N_SOURCE_SHA256" "$BUILD_DIR/ModI18N-source.mod.zip" | sha256sum --check -
          unzip -t "$BUILD_DIR/ModI18N-source.mod.zip" >/dev/null
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'opencc-python-reimplemented==0.1.7'
          mkdir -p "$SITE_DIR/mods"

          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZIP_STORED, ZipFile, ZipInfo
          import hashlib
          import html as html_module
          import json
          import os
          import re

          from opencc import OpenCC

          build = Path(os.environ["BUILD_DIR"])
          site = Path(os.environ["SITE_DIR"])
          source_path = build / "ModI18N-source.mod.zip"
          output_path = site / "mods" / os.environ["I18N_TW_FILENAME"]
          report_path = build / "translation-info.json"
          converter = OpenCC("s2twp")
          source_url = os.environ["I18N_SOURCE_URL"]
          license_url = "https://github.com/Eltirosto/Degrees-of-Lewdity-Chinese-Localization/blob/main/LICENSE"
          target_version = "v0.5.12.11-zhtw-1.0.1"
          text_suffixes = {".css", ".js", ".json", ".md", ".txt"}

          def sha256_bytes(value):
              return hashlib.sha256(value).hexdigest()

          def copy_info(source, directory=False):
              target = ZipInfo(source.filename, source.date_time)
              target.comment = source.comment
              target.extra = source.extra
              target.create_system = source.create_system
              target.external_attr = source.external_attr
              target.internal_attr = source.internal_attr
              target.flag_bits = source.flag_bits
              target.compress_type = ZIP_STORED if directory else ZIP_DEFLATED
              return target

          required = {
              "boot.json",
              "i18n.json",
              "dist/i18nLoad.js",
              "dist/earlyload/earlyload.js",
              "dist/preload/preload.js",
          }

          with ZipFile(source_path) as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"Source ModI18N archive is missing: {missing}")

              source_i18n_text = archive.read("i18n.json").decode("utf-8")
              source_data = json.loads(source_i18n_text)
              translated_i18n_text = converter.convert(source_i18n_text)
              translated_data = json.loads(translated_i18n_text)

              source_entries = []
              translated_entries = []
              for group in source_data["typeB"].values():
                  source_entries.extend(group)
              for group in translated_data["typeB"].values():
                  translated_entries.extend(group)
              if len(source_entries) != len(translated_entries):
                  raise SystemExit("Traditional conversion changed the translation entry count")

              changed_targets = 0
              translated_targets = 0
              for before, after in zip(source_entries, translated_entries, strict=True):
                  for immutable in ("f", "pN", "fileName", "pos", "js"):
                      if before.get(immutable) != after.get(immutable):
                          raise SystemExit(f"Traditional conversion changed immutable field {immutable}")
                  if before.get("t") != after.get("t"):
                      changed_targets += 1
                  if any("\u3400" <= char <= "\u9fff" for char in after.get("t", "")):
                      translated_targets += 1

              if len(source_entries) != 198095:
                  raise SystemExit(f"Unexpected translation entry count: {len(source_entries)}")
              if translated_targets != 196999:
                  raise SystemExit(f"Unexpected translated target count: {translated_targets}")
              if changed_targets < 100000:
                  raise SystemExit(f"Too few entries changed to Traditional Chinese: {changed_targets}")
              if "開始遊戲！" not in translated_i18n_text:
                  raise SystemExit("Traditional start-control translation is missing")
              if "开始游戏！" in translated_i18n_text:
                  raise SystemExit("Simplified start-control translation remains")

              for token in ("<<", ">>", "[[", "]]", "<span", "</span", "$player"):
                  if source_i18n_text.count(token) != translated_i18n_text.count(token):
                      raise SystemExit(f"Traditional conversion changed structural token count: {token}")

              # The community translation targets upstream DoL. DoLP changes the
              # position of many otherwise identical strings and replaces a small
              # number of them. ModI18N normally rolls back an entire passage when
              # one positional match fails, so adapt every retained rule to the
              # exact v0.778 content and omit only rules whose English source no
              # longer exists. This keeps DoLP additions intact and prevents tens
              # of thousands of expensive fuzzy-match failures on mobile Safari.
              upstream = (build / "upstream.html").read_text(encoding="utf-8-sig")
              passages = {}
              for match in re.finditer(
                  r'<tw-passagedata\b([^>]*)>(.*?)</tw-passagedata>',
                  upstream,
                  flags=re.DOTALL,
              ):
                  name_match = re.search(r'\bname="([^"]*)"', match.group(1))
                  if name_match:
                      passages[html_module.unescape(name_match.group(1))] = html_module.unescape(match.group(2))

              def split_tweego_files(kind, closing_tag):
                  marker = re.compile(r'/\* ' + kind + r' #\d+: "([^"]+)" \*/')
                  matches = list(marker.finditer(upstream))
                  files = {}
                  for index, match in enumerate(matches):
                      end = matches[index + 1].start() if index + 1 < len(matches) else upstream.find(closing_tag, match.end())
                      if end < 0:
                          raise SystemExit(f"Cannot find {closing_tag} after {match.group(1)}")
                      files[match.group(1).rsplit("/", 1)[-1]] = upstream[match.end():end]
                  return files

              scripts = split_tweego_files("twine-user-script", "</script>")
              styles = split_tweego_files("twine-user-stylesheet", "</style>")

              def find_nearest(source, needle, hint):
                  if not source or not needle:
                      return None
                  positions = []
                  start = 0
                  while True:
                      found = source.find(needle, start)
                      if found < 0:
                          break
                      positions.append(found)
                      start = found + max(1, len(needle))
                  return min(positions, key=lambda value: abs(value - hint)) if positions else None

              retained = 0
              omitted = 0
              repositioned = 0
              for group_name, entries in list(translated_data["typeB"].items()):
                  compatible = []
                  for entry in entries:
                      if entry.get("pN"):
                          container = passages.get(entry["pN"])
                      elif entry.get("js"):
                          container = scripts.get(entry.get("fileName"))
                      elif entry.get("css"):
                          container = styles.get(entry.get("fileName"))
                      else:
                          container = None
                      actual = find_nearest(container, entry.get("f", ""), entry.get("pos", 0))
                      if actual is None:
                          omitted += 1
                          continue
                      if actual != entry.get("pos"):
                          repositioned += 1
                          entry["pos"] = actual
                      compatible.append(entry)
                  translated_data["typeB"][group_name] = compatible
                  retained += len(compatible)

              if retained < 190000 or omitted > 2000:
                  raise SystemExit(f"Unexpected DoLP compatibility result: retained={retained}, omitted={omitted}")
              translated_i18n_text = json.dumps(
                  translated_data,
                  ensure_ascii=False,
                  separators=(",", ":"),
              )
              if "開始遊戲！" not in translated_i18n_text:
                  raise SystemExit("DoLP-compatible rules lost the Traditional start control")

              with ZipFile(output_path, "w", compression=ZIP_DEFLATED, compresslevel=9) as output:
                  for info in archive.infolist():
                      if info.is_dir():
                          output.writestr(copy_info(info, directory=True), b"")
                          continue

                      raw = archive.read(info.filename)
                      suffix = Path(info.filename).suffix.lower()
                      if info.filename == "i18n.json":
                          raw = translated_i18n_text.encode("utf-8")
                      elif suffix in text_suffixes:
                          text = converter.convert(raw.decode("utf-8"))
                          if info.filename == "boot.json":
                              boot = json.loads(text)
                              if boot.get("name") != "ModI18N":
                                  raise SystemExit("Unexpected ModI18N name")
                              dependency = next(
                                  (
                                      item
                                      for item in boot.get("dependenceInfo", [])
                                      if item.get("modName") == "GameVersion"
                                  ),
                                  None,
                              )
                              if not dependency or dependency.get("version") != "=0.5.12.11":
                                  raise SystemExit("Source ModI18N is not pinned to game core 0.5.12.11")
                              boot["version"] = target_version
                              additions = boot.setdefault("additionFile", [])
                              if "ATTRIBUTION.zh-TW.md" not in additions:
                                  additions.append("ATTRIBUTION.zh-TW.md")
                              text = json.dumps(boot, ensure_ascii=False, indent=2) + "\n"
                          raw = text.encode("utf-8")
                      output.writestr(copy_info(info), raw)

                  attribution = f"""# ModI18N 繁體中文（台灣）改作版

          本模組以 Degrees of Lewdity 中文漢化社群的 `ModI18N-0.5.12.11-chs-auto-nightly` 為基礎，使用 OpenCC `s2twp` 規則轉換為繁體中文並調整模組版本資訊。

          - 原始漢化專案：https://github.com/Eltirosto/Degrees-of-Lewdity-Chinese-Localization
          - 原始構建來源：{source_url}
          - 修改內容：簡體中文字詞轉為繁體中文（台灣慣用詞），英文來源欄位、Twine 巨集、程式識別字與依賴版本保持不變。
          - 授權：CC BY-NC-SA 4.0（署名－非商業性－相同方式分享）
          - 授權全文：{license_url}
          - 狀態：非漢化組官方發行版；不代表原漢化組背書。
          """
                  info = ZipInfo("ATTRIBUTION.zh-TW.md", (2026, 9, 15, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  output.writestr(info, attribution.encode("utf-8"))

          with ZipFile(output_path) as output:
              if output.testzip() is not None:
                  raise SystemExit("The Traditional Chinese Mod archive is corrupt")
              boot = json.loads(output.read("boot.json").decode("utf-8"))
              if boot.get("version") != target_version:
                  raise SystemExit("Repacked Traditional Chinese Mod has the wrong version")

          report = {
              "language": "zh-TW",
              "conversion": "OpenCC s2twp",
              "source": source_url,
              "sourceSha256": sha256_bytes(source_path.read_bytes()),
              "sourceVersion": os.environ["I18N_SOURCE_VERSION"],
              "targetVersion": target_version,
              "targetFile": output_path.name,
              "targetBytes": output_path.stat().st_size,
              "targetSha256": sha256_bytes(output_path.read_bytes()),
              "translationEntries": len(source_entries),
              "compatibleEntries": retained,
              "incompatibleEntriesOmitted": omitted,
              "positionsAdaptedForDoLP": repositioned,
              "translatedTargets": translated_targets,
              "targetsChangedToTraditional": changed_targets,
              "startControl": "開始遊戲！",
              "license": "CC BY-NC-SA 4.0",
              "licenseUrl": license_url,
              "attributionIncluded": True,
          }
          report_path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          (site / "modList.json").write_text(
              json.dumps([f"mods/{output_path.name}"], ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Add iPhone launch metadata and remove obsolete web-launcher files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import shutil
          import struct
          import zlib

          build = Path(os.environ["BUILD_DIR"])
          site = Path(os.environ["SITE_DIR"])
          index = site / "index.html"
          upstream = build / "upstream.html"

          for stale_file in ("sw.js", "pako_inflate.min.js"):
              (site / stale_file).unlink(missing_ok=True)
          shutil.rmtree(site / "payload", ignore_errors=True)

          html = index.read_text(encoding="utf-8-sig")
          head = re.search(r"<head\b[^>]*>", html, flags=re.IGNORECASE)
          if not head:
              raise SystemExit("The upstream game has no <head> element")

          mobile = """
          <!-- data-dolp-pwa-v0778 -->
          <meta name="theme-color" content="#111111">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
          <meta name="apple-mobile-web-app-title" content="DoLP v0.778 繁中">
          <link rel="manifest" href="manifest.json">
          <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
          <script>
          (() => {
            const here = new URL(".", location.href).pathname;
            if ("serviceWorker" in navigator) {
              navigator.serviceWorker.getRegistrations()
                .then(registrations => Promise.all(
                  registrations
                    .filter(registration => new URL(registration.scope).pathname === here)
                    .map(registration => registration.unregister())
                ))
                .catch(() => {});
            }
          })();
          </script>
          """
          html = html[:head.end()] + mobile + html[head.end():]
          index.write_text(html, encoding="utf-8")

          optional_files = {
              "modList.json": "[]\n",
              "style.css": "/* Optional DoLP stylesheet hook. */\n",
              "usettings.js": "// Optional SugarCube user-settings hook.\n",
          }
          for filename, content in optional_files.items():
              target = site / filename
              if not target.exists():
                  target.write_text(content, encoding="utf-8")

          manifest = {
              "name": "DoLP v0.778 · Aoki Utage + Mysterious · 繁體中文 · ModLoader",
              "short_name": "DoLP 0.778 繁中",
              "start_url": "./",
              "scope": "./",
              "display": "standalone",
              "background_color": "#111111",
              "theme_color": "#111111",
              "icons": [
                  {
                      "src": "icon-192.png",
                      "sizes": "192x192",
                      "type": "image/png",
                      "purpose": "any maskable",
                  }
              ],
          }
          (site / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )

          def png_chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF)
              )

          def write_icon(path, size):
              rows = []
              for y in range(size):
                  row = bytearray([0])
                  for x in range(size):
                      margin = size // 5
                      inside = margin < x < size - margin and margin < y < size - margin
                      stripe = size * 2 // 5 <= x <= size * 3 // 5
                      accent = inside and stripe and size * 2 // 5 <= y <= size * 3 // 5
                      rgb = (180, 25, 45) if accent else ((242, 242, 242) if inside else (17, 17, 17))
                      row += bytes((*rgb, 255))
                  rows.append(bytes(row))
              data = (
                  b"\x89PNG\r\n\x1a\n"
                  + png_chunk(b"IHDR", struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0))
                  + png_chunk(b"IDAT", zlib.compress(b"".join(rows), 9))
                  + png_chunk(b"IEND", b"")
              )
              path.write_bytes(data)

          write_icon(site / "icon-192.png", 192)
          write_icon(site / "apple-touch-icon.png", 180)
          (site / ".nojekyll").touch()
          (site / "version.txt").write_text(
              "DoLP v0.778 · Aoki Utage + Mysterious · 繁體中文 · ML v2.101.1\n",
              encoding="utf-8",
          )

          image_paths = [path for path in (site / "img").rglob("*") if path.is_file()]
          upstream_bytes = upstream.read_bytes()
          published_bytes = index.read_bytes()
          marker = re.search(rb"([0-9]+(?:\.[0-9]+){2,3}\s+DoLP v0\.778)", upstream_bytes)
          info = {
              "version": "DoLP v0.778",
              "edition": "Aoki Utage + Mysterious",
              "source": os.environ["PACKAGE_URL"],
              "sourceHtml": (build / "source-html-name.txt").read_text(encoding="utf-8").strip(),
              "core": marker.group(1).decode("ascii") if marker else "DoLP v0.778",
              "packageBytes": (build / "package.zip").stat().st_size,
              "packageSha256": hashlib.sha256((build / "package.zip").read_bytes()).hexdigest(),
              "upstreamHtmlBytes": len(upstream_bytes),
              "upstreamHtmlSha256": hashlib.sha256(upstream_bytes).hexdigest(),
              "publishedHtmlBytes": len(published_bytes),
              "publishedHtmlSha256": hashlib.sha256(published_bytes).hexdigest(),
              "imageFiles": len(image_paths),
              "imageBytes": sum(path.stat().st_size for path in image_paths),
              "modLoader": "ML v2.101.1",
              "loaderSource": os.environ["LOADER_URL"],
              "loaderArchiveBytes": (build / "modloader.zip").stat().st_size,
              "loaderArchiveSha256": hashlib.sha256((build / "modloader.zip").read_bytes()).hexdigest(),
              "loaderArchiveExpectedSha256": os.environ["LOADER_SHA256"],
              "loaderSourceHtml": (build / "loader-html-name.txt").read_text(encoding="utf-8").strip(),
              "loaderCompanionSha256": hashlib.sha256((build / "loader-companion.html").read_bytes()).hexdigest(),
              "loaderInstall": json.loads((build / "loader-info.json").read_text(encoding="utf-8")),
              "language": "zh-TW",
              "translation": json.loads((build / "translation-info.json").read_text(encoding="utf-8")),
              "deployment": "direct index.html with ModLoader; no Service Worker or compressed web launcher",
              "sourceCommit": os.environ["GITHUB_SHA"],
              "publishedAt": datetime.now(timezone.utc).isoformat(),
          }
          (site / "build-info.json").write_text(
              json.dumps(info, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Audit every published component against the pinned v0.778 sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import json
          import os
          import re

          build = Path(os.environ["BUILD_DIR"])
          site = Path(os.environ["SITE_DIR"])
          upstream_path = build / "upstream.html"
          published_path = site / "index.html"
          companion_path = build / "loader-companion.html"

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          def image_manifest(root):
              records = []
              total_bytes = 0
              manifest_hash = hashlib.sha256()
              for path in sorted((p for p in root.rglob("*") if p.is_file()), key=lambda p: p.relative_to(root).as_posix()):
                  relative = path.relative_to(root).as_posix()
                  size = path.stat().st_size
                  digest = sha256_file(path)
                  records.append((relative, size, digest))
                  total_bytes += size
                  manifest_hash.update(relative.encode("utf-8"))
                  manifest_hash.update(b"\0")
                  manifest_hash.update(str(size).encode("ascii"))
                  manifest_hash.update(b"\0")
                  manifest_hash.update(digest.encode("ascii"))
                  manifest_hash.update(b"\n")
              return records, total_bytes, manifest_hash.hexdigest()

          package_path = build / "package.zip"
          if package_path.stat().st_size != int(os.environ["PACKAGE_BYTES"]):
              raise SystemExit("Pinned v0.778 package byte count changed")
          if sha256_file(package_path) != os.environ["PACKAGE_SHA256"]:
              raise SystemExit("Pinned v0.778 package SHA-256 mismatch")
          if upstream_path.stat().st_size != int(os.environ["UPSTREAM_HTML_BYTES"]):
              raise SystemExit("Pinned v0.778 HTML byte count changed")
          if sha256_file(upstream_path) != os.environ["UPSTREAM_HTML_SHA256"]:
              raise SystemExit("Pinned v0.778 HTML SHA-256 mismatch")

          upstream = upstream_path.read_text(encoding="utf-8-sig")
          published = published_path.read_text(encoding="utf-8")
          companion = companion_path.read_text(encoding="utf-8-sig")

          story_pattern = re.compile(r"<tw-storydata\b[\s\S]*?</tw-storydata>", re.IGNORECASE)
          upstream_story_match = story_pattern.search(upstream)
          published_story_match = story_pattern.search(published)
          if not upstream_story_match or not published_story_match:
              raise SystemExit("Could not isolate the Twine story data")
          upstream_story = upstream_story_match.group(0)
          published_story = published_story_match.group(0)
          if published_story != upstream_story:
              raise SystemExit("Published Twine story data is not byte-identical to official DoLP v0.778")

          script_pattern = re.compile(r"<script\b[^>]*>[\s\S]*?</script>", re.IGNORECASE)
          companion_scripts = [match.group(0) for match in script_pattern.finditer(companion)]
          if len(companion_scripts) < 2:
              raise SystemExit("Official ModLoader build is missing its two leading runtime blocks")
          official_loader_blocks = companion_scripts[:2]
          if "window.modDataValueZipList" not in official_loader_blocks[0]:
              raise SystemExit("Official ModLoader data block is invalid")
          if "modSC2DataManager" not in official_loader_blocks[1] or "jsPreloader" not in official_loader_blocks[1]:
              raise SystemExit("Official ModLoader BeforeSC2 block is invalid")
          for number, block in enumerate(official_loader_blocks, start=1):
              occurrences = published.count(block)
              if occurrences != 1:
                  raise SystemExit(f"Official ModLoader block {number} occurrence count is {occurrences}, expected 1")

          sugarcube_scripts = re.findall(
              r"<script\b(?=[^>]*\bid=[\"']script-sugarcube[\"'])[^>]*>",
              published,
              flags=re.IGNORECASE,
          )
          if len(sugarcube_scripts) != 1:
              raise SystemExit(f"Published SugarCube engine count is {len(sugarcube_scripts)}, expected 1")

          exact_version_line = "0.5.12.11 DoLP v0.778 -(ML-v2.101.1)"
          if "0.5.12.11 DoLP v0.778" not in published:
              raise SystemExit("The active DoLP v0.778 core marker is missing")

          shell_without_story = (
              published[:published_story_match.start()]
              + published[published_story_match.end():]
          )
          forbidden_shell_markers = (
              "DoLP v0.768",
              "DoLP v0.772",
              "DoLP v0.775",
              "game-v0768",
              "game-v0772",
              "game-v0775",
              "v0768",
              "v0772",
              "v0775",
          )
          legacy_shell_hits = {
              marker: shell_without_story.count(marker)
              for marker in forbidden_shell_markers
          }
          if any(legacy_shell_hits.values()):
              raise SystemExit(f"Legacy active-site markers found outside official story history: {legacy_shell_hits}")

          source_html = next(
              path for path in (build / "unpacked").rglob("*")
              if path.is_file() and path.name.lower().startswith("degrees of lewdity") and path.suffix.lower() == ".html"
          )
          source_images, source_image_bytes, source_image_manifest_sha = image_manifest(source_html.parent / "img")
          published_images, published_image_bytes, published_image_manifest_sha = image_manifest(site / "img")
          if source_images != published_images:
              source_map = {path: (size, digest) for path, size, digest in source_images}
              published_map = {path: (size, digest) for path, size, digest in published_images}
              missing = sorted(set(source_map) - set(published_map))
              extra = sorted(set(published_map) - set(source_map))
              changed = sorted(
                  path for path in set(source_map) & set(published_map)
                  if source_map[path] != published_map[path]
              )
              raise SystemExit(
                  "Published image tree differs from official v0.778: "
                  f"missing={missing[:10]}, extra={extra[:10]}, changed={changed[:10]}"
              )
          if len(published_images) != int(os.environ["EXPECTED_IMAGE_FILES"]):
              raise SystemExit("Published v0.778 image count mismatch")
          if published_image_bytes != int(os.environ["EXPECTED_IMAGE_BYTES"]):
              raise SystemExit("Published v0.778 image byte count mismatch")

          root_entries = sorted(path.name for path in site.iterdir())
          expected_root_entries = sorted((
              ".nojekyll",
              "apple-touch-icon.png",
              "build-info.json",
              "icon-192.png",
              "img",
              "index.html",
              "manifest.json",
              "modList.json",
              "mods",
              "style.css",
              "usettings.js",
              "version.txt",
          ))
          if root_entries != expected_root_entries:
              raise SystemExit(
                  f"Unexpected published root entries: actual={root_entries}, expected={expected_root_entries}"
              )

          legacy_path_pattern = re.compile(r"(?:^|[/_.-])(?:v?0?7(?:68|72|75)|768|772|775)(?:$|[/_.-])", re.IGNORECASE)
          legacy_paths = [
              path.relative_to(site).as_posix()
              for path in site.rglob("*")
              if legacy_path_pattern.search(path.relative_to(site).as_posix())
          ]
          if legacy_paths:
              raise SystemExit(f"Legacy-version paths remain in the site: {legacy_paths[:20]}")

          build_info = json.loads((site / "build-info.json").read_text(encoding="utf-8"))
          manifest = json.loads((site / "manifest.json").read_text(encoding="utf-8"))
          translation_info = build_info.get("translation", {})
          translation_mod = site / "mods" / os.environ["I18N_TW_FILENAME"]
          expected_mod_list = [f"mods/{os.environ['I18N_TW_FILENAME']}"]
          expected_info = {
              "version": "DoLP v0.778",
              "edition": "Aoki Utage + Mysterious",
              "core": "0.5.12.11 DoLP v0.778",
              "packageSha256": os.environ["PACKAGE_SHA256"],
              "modLoader": "ML v2.101.1",
              "loaderArchiveSha256": os.environ["LOADER_SHA256"],
              "language": "zh-TW",
          }
          for key, expected in expected_info.items():
              if build_info.get(key) != expected:
                  raise SystemExit(f"build-info.json {key} mismatch: {build_info.get(key)!r} != {expected!r}")
          if manifest.get("name") != "DoLP v0.778 · Aoki Utage + Mysterious · 繁體中文 · ModLoader":
              raise SystemExit("Manifest name is not the v0.778 edition")
          if manifest.get("short_name") != "DoLP 0.778 繁中":
              raise SystemExit("Manifest short name is not v0.778")
          if (site / "version.txt").read_text(encoding="utf-8") != "DoLP v0.778 · Aoki Utage + Mysterious · 繁體中文 · ML v2.101.1\n":
              raise SystemExit("version.txt is not the exact v0.778 edition marker")
          if json.loads((site / "modList.json").read_text(encoding="utf-8")) != expected_mod_list:
              raise SystemExit("modList.json does not preload exactly the pinned zh-TW ModI18N")
          if sorted(path.name for path in (site / "mods").iterdir()) != [os.environ["I18N_TW_FILENAME"]]:
              raise SystemExit("The published mods directory does not contain exactly the zh-TW ModI18N")
          if not translation_mod.is_file():
              raise SystemExit("The published zh-TW ModI18N is missing")
          if translation_info.get("sourceSha256") != os.environ["I18N_SOURCE_SHA256"]:
              raise SystemExit("The zh-TW ModI18N source hash is not pinned")
          if translation_info.get("sourceVersion") != os.environ["I18N_SOURCE_VERSION"]:
              raise SystemExit("The zh-TW ModI18N source version is wrong")
          if translation_info.get("targetFile") != os.environ["I18N_TW_FILENAME"]:
              raise SystemExit("The zh-TW ModI18N target filename is wrong")
          if translation_info.get("targetSha256") != sha256_file(translation_mod):
              raise SystemExit("The published zh-TW ModI18N hash is wrong")
          if translation_info.get("translationEntries") != 198095:
              raise SystemExit("The zh-TW ModI18N translation entry count is wrong")
          if translation_info.get("translatedTargets") != 196999:
              raise SystemExit("The zh-TW ModI18N translated target count is wrong")
          if translation_info.get("targetsChangedToTraditional", 0) < 100000:
              raise SystemExit("The zh-TW ModI18N did not convert enough translation targets")
          if translation_info.get("license") != "CC BY-NC-SA 4.0" or not translation_info.get("attributionIncluded"):
              raise SystemExit("The zh-TW ModI18N attribution or license metadata is missing")
          with ZipFile(translation_mod) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("The published zh-TW ModI18N archive is corrupt")
              names = set(archive.namelist())
              if not {"boot.json", "i18n.json", "ATTRIBUTION.zh-TW.md"}.issubset(names):
                  raise SystemExit("The published zh-TW ModI18N has an incomplete archive tree")
              boot = json.loads(archive.read("boot.json").decode("utf-8"))
              if boot.get("name") != "ModI18N" or boot.get("version") != "v0.5.12.11-zhtw-1.0.0":
                  raise SystemExit("The published zh-TW ModI18N boot metadata is wrong")
              translated_i18n = archive.read("i18n.json").decode("utf-8")
              if "開始遊戲！" not in translated_i18n or "开始游戏！" in translated_i18n:
                  raise SystemExit("The published ModI18N did not retain the Traditional start control")

          story_bytes = upstream_story.encode("utf-8")
          report = {
              "result": "pass",
              "version": "DoLP v0.778",
              "core": "0.5.12.11 DoLP v0.778",
              "edition": "Aoki Utage + Mysterious",
              "activeVersionLine": exact_version_line,
              "package": {
                  "bytes": package_path.stat().st_size,
                  "sha256": sha256_file(package_path),
                  "matchesPinnedV0778": True,
              },
              "gameHtml": {
                  "bytes": upstream_path.stat().st_size,
                  "sha256": sha256_file(upstream_path),
                  "matchesPinnedV0778": True,
              },
              "storyData": {
                  "bytes": len(story_bytes),
                  "sha256": hashlib.sha256(story_bytes).hexdigest(),
                  "byteIdenticalToOfficialV0778": True,
                  "officialHistoryMentions": {
                      "DoLP v0.772": upstream_story.count("DoLP v0.772"),
                      "DoLP v0.775": upstream_story.count("DoLP v0.775"),
                  },
              },
              "modLoader": {
                  "version": "ML v2.101.1",
                  "targetCore": "0.5.12.11",
                  "archiveSha256": sha256_file(build / "modloader.zip"),
                  "officialBlocks": 2,
                  "eachBlockOccursOnce": True,
                  "sugarCubeEngines": 1,
              },
              "translation": translation_info,
              "images": {
                  "files": len(published_images),
                  "bytes": published_image_bytes,
                  "manifestSha256": published_image_manifest_sha,
                  "sourceManifestSha256": source_image_manifest_sha,
                  "byteIdenticalToOfficialV0778": True,
              },
              "publishedTree": {
                  "rootEntriesBeforeAuditReport": root_entries,
                  "legacyVersionPaths": legacy_paths,
                  "legacyActiveShellMarkers": legacy_shell_hits,
              },
          }
          (site / "content-audit.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Run the ModLoader in a mobile browser smoke test
        shell: bash
        run: |
          set -euo pipefail

          TEST_SERVER_PID=''
          cleanup() {
            if test -n "$TEST_SERVER_PID"; then
              kill "$TEST_SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          python3 -m http.server 4173 --bind 127.0.0.1 --directory "$SITE_DIR" > "$BUILD_DIR/http-server.log" 2>&1 &
          TEST_SERVER_PID="$!"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error 'http://127.0.0.1:4173/build-info.json' >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error 'http://127.0.0.1:4173/build-info.json' >/dev/null

          CHROME_BIN="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          test -n "$CHROME_BIN"

          mkdir -p "$BUILD_DIR/runtime-check"
          cd "$BUILD_DIR/runtime-check"
          npm init -y >/dev/null 2>&1
          npm install --silent --no-save playwright-core@1.55.0

          CHROME_BIN="$CHROME_BIN" node - <<'JS'
          const { chromium } = require("playwright-core");

          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.CHROME_BIN,
              headless: true,
              args: [
                "--no-sandbox",
                "--disable-dev-shm-usage",
                "--disable-gpu",
                "--js-flags=--max-old-space-size=4096",
              ],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 3,
              isMobile: true,
              hasTouch: true,
              userAgent:
                "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) " +
                "AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 " +
                "Mobile/15E148 Safari/604.1",
            });
            const page = await context.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            page.on("pageerror", error => pageErrors.push(String(error)));
            page.on("console", message => {
              if (message.type() === "error") consoleErrors.push(message.text());
            });

            await page.goto("http://127.0.0.1:4173/", {
              waitUntil: "domcontentloaded",
              timeout: 120000,
            });
            let labelWaitError = null;
            try {
              await page.waitForFunction(
                () => document.body.innerText.includes("ML-v2.101.1"),
                null,
                { timeout: 180000, polling: 500 }
              );
            } catch (error) {
              labelWaitError = String(error);
            }
            let translationWaitError = null;
            try {
              await page.waitForFunction(
                () =>
                  typeof window.modI18N !== "undefined" &&
                  window.modSC2DataManager?.getLanguageManager?.().mainLanguage === "zh" &&
                  document.body.innerText.includes("開始遊戲！"),
                null,
                { timeout: 300000, polling: 500 }
              );
            } catch (error) {
              translationWaitError = String(error);
            }

            const state = await page.evaluate(() => {
              const text = document.body.innerText;
              const versionLines = text
                .split("\n")
                .map(line => line.trim())
                .filter(line => /DoLP v0\.778|ML[- ]v2\.101\.1|ModLoader/i.test(line));
              return {
                title: document.title,
                readyState: document.readyState,
                versionLines,
                hasV0778: text.includes("0.5.12.11 DoLP v0.778"),
                hasModLoaderLabel: text.includes("ML-v2.101.1"),
                hasExactVersionLine: text.includes("0.5.12.11 DoLP v0.778 -(ML-v2.101.1)"),
                hasPrngError: text.includes("reading 'prng'"),
                hasManager: typeof window.modSC2DataManager !== "undefined",
                hasPreloader: typeof window.jsPreloader !== "undefined",
                hasI18N: typeof window.modI18N !== "undefined",
                hasTranslationMod: Boolean(
                  window.modSC2DataManager?.getModLoader?.().getModByNameOne("ModI18N")
                ),
                translationLanguage:
                  window.modSC2DataManager?.getLanguageManager?.().mainLanguage ?? null,
                hasTraditionalStartControl: text.includes("開始遊戲！"),
                hanCharacterCount: (text.match(/[\u3400-\u9fff]/g) || []).length,
                embeddedModZipCount: Array.isArray(window.modDataValueZipList)
                  ? window.modDataValueZipList.length
                  : -1,
                hasStoryInterface: Boolean(
                  document.querySelector("#story, #passages, #ui-bar")
                ),
                hasStartControl: text.includes("開始遊戲！"),
              };
            });

            const fatalConsoleErrors = consoleErrors.filter(message =>
              /prng|Cannot redefine property|initI10n is not a function|漢化與遊戲版本不匹配|汉化与游戏版本不匹配/i.test(message)
            );
            console.log(JSON.stringify({ state, labelWaitError, translationWaitError, pageErrors, consoleErrors, fatalConsoleErrors }, null, 2));
            if (!state.hasV0778) throw new Error("v0.778 core label did not render");
            if (!state.hasModLoaderLabel) throw new Error("ML-v2.101.1 label did not render");
            if (!state.hasExactVersionLine) throw new Error("The combined DoLP/ModLoader version line did not render");
            if (state.hasPrngError) throw new Error("The game rendered a State.prng startup error");
            if (!state.hasManager) throw new Error("modSC2DataManager is unavailable");
            if (!state.hasPreloader) throw new Error("jsPreloader is unavailable");
            if (translationWaitError) throw new Error("The Traditional Chinese UI did not render: " + translationWaitError);
            if (!state.hasI18N || !state.hasTranslationMod) {
              throw new Error("The Traditional Chinese ModI18N did not load");
            }
            if (state.translationLanguage !== "zh") {
              throw new Error("The ModLoader language manager is not using Chinese");
            }
            if (!state.hasTraditionalStartControl || state.hanCharacterCount < 10) {
              throw new Error("The rendered page is not visibly Traditional Chinese");
            }
            if (state.embeddedModZipCount < 1) throw new Error("Embedded Mod ZIP list is empty");
            if (!state.hasStoryInterface || !state.hasStartControl) {
              throw new Error("The playable start interface did not render");
            }
            if (pageErrors.length) {
              throw new Error("Browser page errors: " + pageErrors.join(" | "));
            }
            if (fatalConsoleErrors.length) {
              throw new Error("Fatal console errors: " + fatalConsoleErrors.join(" | "));
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

      - name: Validate the generated website
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SITE_DIR/index.html"
          test -d "$SITE_DIR/img"
          test -s "$SITE_DIR/build-info.json"
          test -s "$SITE_DIR/content-audit.json"
          test -s "$SITE_DIR/manifest.json"
          test -s "$SITE_DIR/apple-touch-icon.png"
          test -s "$SITE_DIR/mods/$I18N_TW_FILENAME"
          test ! -e "$SITE_DIR/sw.js"
          test ! -e "$SITE_DIR/payload"
          grep -aFq 'DoLP v0.778' "$SITE_DIR/index.html"
          grep -aFq 'window.modDataValueZipList' "$SITE_DIR/index.html"
          grep -aFq 'modSC2DataManager' "$SITE_DIR/index.html"
          grep -aFq 'window.mainStart' "$SITE_DIR/index.html"
          grep -aFq 'data-dolp-pwa-v0778' "$SITE_DIR/index.html"
          python3 -m json.tool "$SITE_DIR/build-info.json" >/dev/null
          python3 -m json.tool "$SITE_DIR/content-audit.json" >/dev/null
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["result"])' "$SITE_DIR/content-audit.json")" = "pass"
          python3 -m json.tool "$SITE_DIR/manifest.json" >/dev/null
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["language"])' "$SITE_DIR/build-info.json")" = "zh-TW"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["translation"]["targetSha256"])' "$SITE_DIR/build-info.json")" = "$(sha256sum "$SITE_DIR/mods/$I18N_TW_FILENAME" | cut -d' ' -f1)"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))[0])' "$SITE_DIR/modList.json")" = "mods/$I18N_TW_FILENAME"
          unzip -t "$SITE_DIR/mods/$I18N_TW_FILENAME" >/dev/null

          HTML_BYTES="$(stat -c '%s' "$SITE_DIR/index.html")"
          IMAGE_FILES="$(find "$SITE_DIR/img" -type f | wc -l)"
          test "$HTML_BYTES" -lt 99000000
          test "$IMAGE_FILES" = "$EXPECTED_IMAGE_FILES"

      - name: Replace the gh-pages branch contents
        shell: bash
        run: |
          set -euo pipefail
          test "$PAGES_DIR" = "/tmp/dolp-v0778-pages"
          rm -rf "$PAGES_DIR"

          git fetch origin gh-pages
          git worktree add --detach "$PAGES_DIR" origin/gh-pages
          test -f "$PAGES_DIR/.git"

          git -C "$PAGES_DIR" rm -r --ignore-unmatch .
          find "$PAGES_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          cp -a "$SITE_DIR"/. "$PAGES_DIR"/

          git -C "$PAGES_DIR" add -A
          git -C "$PAGES_DIR" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish DoLP v0.778 zh-TW with ModLoader v2.101.1'
          git -C "$PAGES_DIR" push origin HEAD:gh-pages
